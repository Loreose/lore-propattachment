name: Bump Version

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Bu adım, botun kendi commit'inde tekrar çalışmasını engeller (sonsuz döngüyü önler)
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Kendi token'ınızı kullanıyorsanız ve workflow'un tetiklenmesini istiyorsanız buraya PAT (Personal Access Token) ekleyebilirsiniz
          # token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version in fxmanifest.lua
        run: |
          # Mevcut versiyonu al (version '1.0.0' formatını arar)
          CURRENT_VERSION=$(grep -oP "version '\K[0-9]+\.[0-9]+\.[0-9]+" fxmanifest.lua)
          
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Versiyon fxmanifest.lua içinde bulunamadı veya format hatalı!"
            exit 1
          fi
          
          echo "Mevcut Versiyon: $CURRENT_VERSION"
          
          # Versiyonu parçalara ayır (Major.Minor.Patch)
          IFS='.' read -ra ADDR <<< "$CURRENT_VERSION"
          MAJOR="${ADDR[0]}"
          MINOR="${ADDR[1]}"
          PATCH="${ADDR[2]}"
          
          # Yama (patch) versiyonunu 1 artır (örn. 1.0.0 -> 1.0.1)
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          
          echo "Yeni Versiyon: $NEW_VERSION"
          
          # fxmanifest.lua dosyasındaki eski versiyonu yenisiyle değiştir
          sed -i "s/version '$CURRENT_VERSION'/version '$NEW_VERSION'/g" fxmanifest.lua
          
          # Sonraki adımlarda kullanmak için ENV değişkenine yaz
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fxmanifest.lua
          
          # Eğer bir değişiklik varsa commit at
          if git diff-index --quiet HEAD --; then
            echo "Commit edilecek bir değişiklik yok."
          else
            git commit -m "chore: bump version to ${{ env.NEW_VERSION }}"
            git push
          fi
